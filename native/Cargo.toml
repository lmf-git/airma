[package]
name = "flight_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { git = "https://github.com/godot-rust/gdext", branch = "master", features = ["api-custom", "experimental-threads"] }
fastnoise-lite = "1.1"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
